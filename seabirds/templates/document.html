<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #253344;
        --line: #dce4ea;
        --muted: #617384;
        --code: #f1f5f8;
        --accent: #087f82;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101c28;
          --fg: #e1eaf2;
          --line: #2c3d4f;
          --muted: #a1b2c2;
          --code: #182838;
          --accent: #64d7ca;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.75 system-ui,
          sans-serif;
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 28px;
      }
      header {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 36px;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.3;
        letter-spacing: -0.03em;
      }
      h1 {
        font-size: 2.5rem;
      }
      h2 {
        margin-top: 2em;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.4em;
      }
      a {
        color: var(--accent);
      }
      img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.88em;
        background: var(--code);
        padding: 0.15em 0.35em;
        border-radius: 4px;
      }
      pre {
        overflow: auto;
        background: var(--code);
        padding: 22px;
        border-radius: 8px;
        line-height: 1.65;
      }
      pre code {
        padding: 0;
        background: none;
      }
      .code-card {
        position: relative;
        margin: 24px 0;
      }
      .code-card pre {
        padding-top: 46px;
      }
      .copy-button {
        position: absolute;
        top: 10px;
        right: 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--bg);
        color: var(--fg);
        padding: 5px 10px;
        cursor: pointer;
      }
      .table-card {
        padding: 48px 16px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .tabela-container {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }
      th,
      td {
        text-align: left;
        border: 1px solid var(--line);
        padding: 10px 14px;
      }
      th {
        background: var(--code);
      }
      blockquote {
        margin: 24px 0;
        padding: 10px 20px;
        border-left: 3px solid var(--accent);
        color: var(--muted);
        background: var(--code);
      }
      .botao-link {
        display: inline-block;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 7px 14px;
        text-decoration: none;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 32px 0;
      }
      footer {
        margin-top: 56px;
        color: var(--muted);
        font-size: 12px;
      }
      @media print {
        .copy-button {
          display: none;
        }
        body {
          max-width: none;
          padding: 0;
        }
      }
      .distaque-pipe {
        margin: 24px 0;
        padding: 10px 20px;
        border-left: 3px solid var(--accent);
        background: var(--code);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>SeaBirdsCloud / Documentação</header>
    <main>{{content}}</main>
    <footer>Documentação criada com SeaBirdsCloud.</footer>
    <script>
      document.addEventListener("click", async (event) => {
        const button = event.target.closest(".copy-button");
        if (!button) return;
        const card = button.parentElement;
        const text = (card.querySelector("code") || card.querySelector("table"))
          .innerText;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const area = document.createElement("textarea");
            area.value = text;
            document.body.append(area);
            area.select();
            if (!document.execCommand("copy")) throw Error();
            area.remove();
          }
          button.textContent = "Copiado!";
          setTimeout(() => (button.textContent = "Copiar"), 1600);
        } catch {
          button.textContent = "Selecione e copie";
        }
      });
    </script>
  </body>
</html>
