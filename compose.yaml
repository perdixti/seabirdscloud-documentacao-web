services:
  seabirds:
    build: .
    restart: unless-stopped
    ports:
      - "${SEABIRDS_BIND:-127.0.0.1}:${SEABIRDS_PORT:-8000}:8000"
    environment:
      SEABIRDS_USERNAME: "${SEABIRDS_USERNAME:-admin}"
      SEABIRDS_PASSWORD: "${SEABIRDS_PASSWORD:-}"
      SEABIRDS_HISTORY_LIMIT: "${SEABIRDS_HISTORY_LIMIT:-50}"
      SEABIRDS_GITHUB_TOKEN: "${SEABIRDS_GITHUB_TOKEN:-}"
      SEABIRDS_GITHUB_WORKFLOW: "${SEABIRDS_GITHUB_WORKFLOW:-deploy.yml}"
    volumes:
      - seabirds_data:/data
      - seabirds_site:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m
    cpus: 1.0

volumes:
  seabirds_data:
  seabirds_site:
